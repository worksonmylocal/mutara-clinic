<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Aid · Mutara Clinic</title>
<link rel="icon" type="image/jpeg" href="/assets/clinic/images/mutara-logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/clinic/css/clinic_desk.css?v={{ asset_version }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="topbar"></div>
<div class="page">
  <div class="pagehead" id="pagehead"></div>
  <div class="kpi-grid" id="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="tabs">
    <button class="tab on" data-tab="cases">My Cases</button>
    <button class="tab" data-tab="kit">My Kit</button>
  </div>
  <div class="tabpanel on" id="tab-cases"><div class="card"><div class="card__head"><h3>First Aid Cases</h3><span class="meta" id="cases-meta"></span></div><div class="queue" id="cases"><div class="skel"></div></div></div></div>
  <div class="tabpanel" id="tab-kit"><div class="card"><div class="card__head"><h3>Supplies in My Kit</h3><span class="meta" id="kit-meta"></span></div><div id="kit"><div class="skel"></div></div></div></div>
</div>
<script>window.CLINIC = { csrf: {{ csrf_token | tojson }}, user: {{ frappe.session.user | tojson }} };</script>
<script src="/assets/clinic/js/clinic_desk.js?v={{ asset_version }}"></script>
<script src="/assets/clinic/js/firstaid.js?v={{ asset_version }}"></script>
</body>
</html>
