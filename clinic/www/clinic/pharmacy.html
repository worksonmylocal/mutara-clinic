<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy · Mutara Clinic</title>
<link rel="icon" type="image/jpeg" href="/assets/clinic/images/mutara-logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/clinic/css/clinic_desk.css?v={{ asset_version }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="topbar"></div>
<div class="page">
  <div class="pagehead" id="pagehead"></div>
  <div class="kpi-grid" id="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="tabs">
    <button class="tab on" data-tab="queue">Prescriptions</button>
    <button class="tab" data-tab="done">Dispensed Today</button>
    <button class="tab" data-tab="insights">Insights</button>
  </div>
  <div class="tabpanel on" id="tab-queue"><div class="card"><div class="card__head"><h3>Waiting to be Dispensed</h3><span class="meta" id="queue-meta"></span></div><div class="queue" id="queue"><div class="skel"></div></div></div></div>
  <div class="tabpanel" id="tab-done"><div class="card"><div class="card__head"><h3>Dispensed Today</h3></div><div id="dispensed"><div class="skel"></div></div></div></div>
  <div class="tabpanel" id="tab-insights">
    <div class="row-2-eq">
      <div class="card"><div class="card__head"><h3>Most Dispensed — Last 30 Days</h3><span class="meta">Units</span></div><div id="top-drugs"><div class="skel"></div></div></div>
      <div class="card chart-wrap"><div class="card__head"><h3>Prescriptions Filled — Last 14 Days</h3></div><canvas id="day-chart" height="240"></canvas></div>
    </div>
  </div>
</div>
<script>window.CLINIC = { csrf: {{ csrf_token | tojson }}, user: {{ frappe.session.user | tojson }} };</script>
<script src="/assets/clinic/js/clinic_desk.js?v={{ asset_version }}"></script>
<script src="/assets/clinic/js/pharmacy.js?v={{ asset_version }}"></script>
</body>
</html>
