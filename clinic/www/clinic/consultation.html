<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultation · Mutara Clinic</title>
<link rel="icon" type="image/jpeg" href="/assets/clinic/images/mutara-logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/clinic/css/clinic_desk.css?v={{ asset_version }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="topbar"></div>
<div class="page">
  <div class="pagehead" id="pagehead"></div>
  <div id="view-queue">
    <div class="kpi-grid" id="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <div class="tabs">
      <button class="tab on" data-tab="queue">Queue</button>
      <button class="tab" data-tab="done">Seen Today</button>
      <button class="tab" data-tab="month">Seen This Month</button>
      <button class="tab" data-tab="insights">Insights</button>
    </div>
    <div class="tabpanel on" id="tab-queue">
      <div class="row-2-eq">
        <div class="card"><div class="card__head"><h3>Waiting for Consultation</h3><span class="meta" id="waiting-meta"></span></div><div class="queue" id="waiting"><div class="skel"></div></div></div>
        <div>
          <div class="card"><div class="card__head"><h3>Investigations — Awaiting Results</h3><span class="meta" id="results-meta"></span></div><div class="queue" id="results"><div class="skel"></div></div></div>
          <div class="card"><div class="card__head"><h3>My Open Consultations</h3></div><div class="queue" id="progress"><div class="skel"></div></div></div>
          <div class="card"><div class="card__head"><h3>At the Pharmacy</h3></div><div class="queue" id="flight"><div class="skel"></div></div></div>
        </div>
      </div>
    </div>
    <div class="tabpanel" id="tab-done"><div class="card"><div class="card__head"><h3>Consultations Completed Today</h3></div><div id="completed"><div class="skel"></div></div></div></div>
    <div class="tabpanel" id="tab-month">
      <div class="kpi-grid" id="month-kpis"></div>
      <div class="card"><div class="card__head"><h3>Consultations Completed This Month</h3><span class="meta" id="month-meta"></span></div><div class="tscroll" id="seen-month"><div class="skel"></div></div></div>
    </div>
    <div class="tabpanel" id="tab-insights">
      <div class="row-2-eq">
        <div class="card chart-wrap"><div class="card__head"><h3>Top Diagnoses — Last 30 Days</h3></div><canvas id="dx-chart" height="240"></canvas></div>
        <div class="card chart-wrap"><div class="card__head"><h3>Consultations — Last 14 Days</h3></div><canvas id="day-chart" height="240"></canvas></div>
      </div>
      <div class="card"><div class="card__head"><h3>Workload — Last 30 Days</h3></div><div class="kpi-grid" id="workload" style="margin-bottom:0"></div></div>
    </div>
  </div>
  <div id="view-ws" style="display:none"></div>
</div>
<script>window.CLINIC = { csrf: {{ csrf_token | tojson }}, user: {{ frappe.session.user | tojson }} };</script>
<script src="/assets/clinic/js/clinic_desk.js?v={{ asset_version }}"></script>
<script src="/assets/clinic/js/consultation.js?v={{ asset_version }}"></script>
</body>
</html>
